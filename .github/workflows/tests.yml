name: V2 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: antiscam_test
          POSTGRES_PASSWORD: test-only-local-ci
          POSTGRES_DB: antiscam_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antiscam_test -d antiscam_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANTISCAM_TEST_DATABASE_URL: postgresql+psycopg://antiscam_test:test-only-local-ci@127.0.0.1:5432/antiscam_test_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-ukr tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip check
      - run: ruff check app/v2 app/main.py migrations tests tools ops
      - run: ruff format --check app/v2 app/main.py migrations tests tools ops
      - run: python -m pytest -q
